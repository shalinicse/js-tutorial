<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <title>Short Polling</title> -->
  </head>
  <body>
    <h1>Short Polling Example</h1>
    <div id="data-container"></div>

    <script>
      async function getData() {
        try {
          const response = await fetch("/getData");
          const resJosn = await response.json();
          document.getElementById("data-container").innerHTML = resJosn.data;
        } catch (error) {
          console.log(error);
        }
      }
      //   polling mechanism
      let intervalId;
      const shortPolling = () => {
        intervalId = setInterval(() => {
          getData();
        }, 5000);
      };

      shortPolling();
      //   on any user action or navigation
      clearInterval(intervalId);
    </script>
  </body>
</html>
